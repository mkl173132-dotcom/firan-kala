<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>جزئیات محصول | فیران کالا</title>

          content="مشاهده مشخصات و جزئیات محصولات فیران کالا">

    <link rel="stylesheet" href="style.css">

    <style>

        /* =========================================
           صفحه محصول
        ========================================= */

        .product-page {
            padding: 50px 0 80px;
            background: #f7f9fc;
            min-height: 80vh;
        }

        .product-detail-card {
            background: #ffffff;
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 10px 35px rgba(15, 23, 42, 0.08);
        }

        .product-detail-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 45px;
            align-items: start;
        }

        .product-detail-image {
            width: 100%;
            height: 480px;
            object-fit: contain;
            border-radius: 20px;
            background: #f5f7fa;
            padding: 20px;
        }

        .product-detail-info {
            padding: 10px;
        }

        .product-detail-category {
            display: inline-block;
            background: #eef4ff;
            color: #2563eb;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .product-detail-info h1 {
            font-size: 32px;
            margin: 10px 0 18px;
            color: #111827;
        }

        .product-detail-description {
            color: #6b7280;
            line-height: 2;
            font-size: 16px;
            margin-bottom: 25px;
        }

        .discount-box {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .discount-percent {
            background: #dc2626;
            color: white;
            padding: 7px 12px;
            border-radius: 8px;
            font-weight: bold;
        }

        .detail-old-price {
            color: #9ca3af;
            text-decoration: line-through;
            font-size: 16px;
        }

        .detail-price {
            font-size: 28px;
            color: #2563eb;
            display: block;
            margin-bottom: 25px;
        }

        .stock-status {
            display: inline-block;
            padding: 8px 14px;
            border-radius: 8px;
            background: #dcfce7;
            color: #15803d;
            margin-bottom: 25px;
            font-weight: bold;
        }

        .detail-add-button {
            width: 100%;
            border: none;
            padding: 17px;
            border-radius: 14px;
            background: #2563eb;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .detail-add-button:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
        }

        .back-button {
            display: inline-block;
            margin-bottom: 20px;
            text-decoration: none;
            color: #2563eb;
            font-weight: bold;
        }

        /* =========================================
           مشخصات فنی
        ========================================= */

        .specifications-section {
            margin-top: 35px;
            padding-top: 35px;
            border-top: 1px solid #e5e7eb;
        }

        .specifications-section h2 {
            margin-bottom: 20px;
        }

        .specifications-table {
            width: 100%;
            border-collapse: collapse;
            overflow: hidden;
            border-radius: 14px;
        }

        .specifications-table tr {
            border-bottom: 1px solid #e5e7eb;
        }

        .specifications-table tr:last-child {
            border-bottom: none;
        }

        .specifications-table td {
            padding: 15px;
        }

        .specifications-table td:first-child {
            width: 35%;
            font-weight: bold;
            background: #f8fafc;
            color: #374151;
        }

        .specifications-table td:last-child {
            color: #4b5563;
        }

        /* =========================================
           نظرات
        ========================================= */

        .reviews-section {
            margin-top: 35px;
            padding: 30px;
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 10px 35px rgba(15, 23, 42, 0.07);

            margin-top: 0;
        }

        .review-form {
            margin-top: 25px;
            padding: 25px;
            background: #f8fafc;
            border-radius: 18px;
        }

        .review-form-group {
            margin-bottom: 18px;
        }

        .review-form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .review-form-group input,
        .review-form-group select,
        .review-form-group textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-family: inherit;
            box-sizing: border-box;
        }

        .review-form-group textarea {
            resize: vertical;
        }

        .review-submit {
            border: none;
            background: #2563eb;
            color: white;
            padding: 13px 25px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }

        .review-submit:hover {
            background: #1d4ed8;
        }

        .review-message {
            margin-top: 15px;
            font-weight: bold;
        }

        .review-card {
            padding: 20px 0;
            border-bottom: 1px solid #e5e7eb;
        }

        .review-card:last-child {
            border-bottom: none;
        }

        .review-header {

            gap: 15px;
            margin-bottom: 10px;
        }

            font-size: 18px;
        }

        .product-error {
            background: #fee2e2;
            color: #991b1b;
            padding: 20px;
            border-radius: 14px;
            text-align: center;
        }

           موبایل
        ========================================= */

    /* =========================================
       توابع
    ========================================= */

    function formatPrice(number) {

        return Number(number).toLocaleString("fa-IR")
            + " تومان";

    }


    function getProductId() {

        const params = new URLSearchParams(
            window.location.search
        );

        return params.get("id");

    }


    function updateCartCount() {

        let cart = [];

        try {

            cart =
                JSON.parse(
                    localStorage.getItem("firanCart")
                ) || [];

        } catch {

            cart = [];

        }


        const count =
            cart.reduce(
                (total, item) =>
                    total + item.quantity,
                0
            );


        const element =
            document.getElementById("cartCount");


        if (element) {

            element.textContent =
                count.toLocaleString("fa-IR");

        }

    }


    function addToCart(product) {

        let cart = [];

        try {

            cart =
                JSON.parse(
                    localStorage.getItem("firanCart")
                ) || [];

        } catch {

            cart = [];

        }


        const existing =
            cart.find(
                item => item.id === product.id
            );


        if (existing) {

            existing.quantity += 1;

        } else {

            cart.push({

                id: product.id,

                name: product.name,

                price: product.price,

                quantity: 1

            });

        }


        localStorage.setItem(
            "firanCart",
            JSON.stringify(cart)
        );


        updateCartCount();


        alert(
            "✅ محصول با موفقیت به سبد خرید اضافه شد."
        );

    }

    /* =========================================
       دریافت نظرات
    ========================================= */

    async function loadReviews(productId) {

        const list =
            document.getElementById(
                "reviewList"
            );


        try {

            const response =
                await fetch(
                    "/api/reviews?productId="
                    + encodeURIComponent(productId)
                );


            if (!response.ok) {

                throw new Error(
                    "خطا در دریافت نظرات"
                );

            }


            const reviews =
                await response.json();


            if (
                !Array.isArray(reviews)
                ||
                reviews.length === 0
            ) {

                list.innerHTML = `

                    <div class="no-reviews">

                        هنوز نظری برای این محصول ثبت نشده است.
                        اولین نفری باشید که نظر می‌دهد.

                    </div>

                `;

                return;

            }


            list.innerHTML = "";


            reviews.forEach(
                review => {

                    const rating =
                        Number(
                            review.rating
                        ) || 5;


                    const stars =
                        "★".repeat(
                            Math.max(
                                1,
                                Math.min(
                                    5,
                                    rating
                                )
                            )
                        );


                    const card =
                        document.createElement(
                            "div"
                        );


                    card.className =
                        "review-card";


                    card.innerHTML = `

                        <div class="review-header">

                            <span class="review-name">

                                ${escapeHtml(
                                    review.name
                                    || "مشتری"
                                )}

                            </span>


                            <span class="review-stars">

                                ${stars}

                            </span>

                        </div>


                        <p class="review-text">

                            ${escapeHtml(
                                review.text
                                || ""
                            )}

                        </p>

                    `;


                    list.appendChild(card);

                }
            );

        } catch (error) {

            console.error(error);


            list.innerHTML = `

                <div class="no-reviews">

                    دریافت نظرات امکان‌پذیر نیست.
                    مطمئن شوید سرور فیران کالا در حال اجراست.

                </div>

            `;

        }

    }



    /* =========================================
       ثبت نظر
    ========================================= */

    async function submitReview(
        event,
        productId
    ) {

        event.preventDefault();


        const name =
            document
                .getElementById(
                    "reviewName"
                )
                .value
                .trim();


        const rating =
            Number(
                document
                    .getElementById(
                        "reviewRating"
                    )
                    .value
            );


        const text =
            document
                .getElementById(
                    "reviewText"
                )
                .value
                .trim();


        const message =
            document.getElementById(
                "reviewMessage"
            );


        if (
            !name
            ||
            !text
        ) {

            message.textContent =
                "لطفاً نام و متن نظر را وارد کنید.";

            return;

        }


        message.textContent =
            "در حال ثبت نظر...";


        try {

            const response =
                await fetch(
                    "/api/reviews",
                    {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify({

                                productId,

                                name,

                                rating,

                                text

                            })

                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    data.message
                    ||
                    "ثبت نظر انجام نشد."
                );

            }


            message.textContent =
                "✅ نظر شما با موفقیت ثبت شد.";


            document
                .getElementById(
                    "reviewForm"
                )
                .reset();


            await loadReviews(
                productId
            );

        } catch (error) {

            console.error(error);


            message.textContent =
                "❌ ثبت نظر انجام نشد. سرور را بررسی کنید.";

        }

    }



    /* =========================================
       جلوگیری از ورود HTML در نظرات
    ========================================= */

    function escapeHtml(text) {

        const div =
            document.createElement(
                "div"
            );


        div.textContent =
            String(text);


        return div.innerHTML;

    }



    /* =========================================
       شروع صفحه
    ========================================= */

    document.addEventListener(
        "DOMContentLoaded",
        function () {

            updateCartCount();


            const productId =
                getProductId();


            const product =
                products[productId];


            if (!product) {

                document
                    .getElementById(
                        "productContainer"
                    )
                    .innerHTML = `

                        <div class="product-error">

                            محصول موردنظر پیدا نشد.

                            <br><br>

                            <a href="index.html">

                                بازگشت به فروشگاه

                            </a>

                        </div>

                    `;

                return;

            }


            renderProduct(product);

        }
    );

</script>
