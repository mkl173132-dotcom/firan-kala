<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>جزئیات محصول | فیران کالا</title><link rel="stylesheet" href="style.css"></head><body><header class="header"><div class="container nav"><a class="brand" href="index.html"><img src="images/firan-logo.png" alt="فیران کالا"><span>فیران کالا</span></a><nav><a href="index.html">خانه</a><a href="products.html">محصولات</a><a href="bot.html">دستیار فیران</a><a href="about.html">درباره ما</a></nav><a class="cart-top" href="cart.html">🛒 <b data-cart-count class="cart-count" hidden></b><span>سبد خرید</span></a></div></header><main class="product-page"><div class="container"><a href="products.html" class="back-button">← بازگشت به محصولات</a><div id="productContainer"></div></div></main><footer><div class="container"><span>© ۱۴۰۵ فیران کالا</span></div></footer><script src="products.js"></script><script src="script.js"></script><script>const faN=n=>String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]).replace(/,/g,'٬');const products=window.FIRAN_PRODUCTS||[];const id=new URLSearchParams(location.search).get('id');const p=products.find(x=>x.id===id);const c=document.getElementById('productContainer');if(!p){c.innerHTML='<div class="empty"><h2>محصول پیدا نشد</h2><a class="btn primary" href="products.html">بازگشت به محصولات</a></div>'}else{c.innerHTML=`<section class="product-detail-card"><div class="product-detail-image"><img src="${p.image}" alt="${p.name}"></div><div class="product-detail-info"><small>${p.brand} • ${p.categoryFa}</small><h1>${p.name}</h1><p>${p.desc}</p><strong class="detail-price">${p.price>0?faN(p.price.toLocaleString('en-US'))+' تومان':'استعلام قیمت'}</strong><button id="add" class="btn primary">افزودن به سبد خرید</button><div class="specs"><h3>مشخصات</h3>${Object.entries(p.specs||{}).map(([k,v])=>`<div><b>${k}</b><span>${v}</span></div>`).join('')}</div></div></section><section class="reviews-panel"><div class="section-head"><h2>نظر درباره این کالا</h2></div><form id="reviewForm" class="checkout-form"><label>نام<input id="reviewName" required></label><label>امتیاز<select id="reviewRating"><option value="5">۵</option><option value="4">۴</option><option value="3">۳</option><option value="2">۲</option><option value="1">۱</option></select></label><label>نظر<textarea id="reviewText" required></textarea></label><button class="btn primary">ثبت نظر</button></form><div id="reviewsList"></div></section>`;document.getElementById('add').addEventListener('click',()=>window.addToCart(p.id));loadReviews();document.getElementById('reviewForm').addEventListener('submit',submitReview)}async function loadReviews(){const box=document.getElementById('reviewsList');if(!box)return;try{const r=await fetch('/api/reviews?productId='+encodeURIComponent(p.id));const d=await r.json();box.innerHTML=(d.reviews||[]).map(x=>`<div class="review"><b>${x.name}</b><span>امتیاز: ${faN(x.rating)} از ۵</span><p>${String(x.text).replace(/</g,'&lt;')}</p></div>`).join('')||'<div class="empty small">هنوز نظری ثبت نشده است.</div>'}catch(e){box.innerHTML='<div class="empty small">نمایش نظرات در دسترس نیست.</div>'}}async function submitReview(e){e.preventDefault();try{const r=await fetch('/api/reviews',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({productId:p.id,name:document.getElementById('reviewName').value.trim(),rating:Number(document.getElementById('reviewRating').value),text:document.getElementById('reviewText').value.trim()})});const d=await r.json();if(!r.ok||!d.success)throw new Error(d.message||'ثبت نظر انجام نشد');e.target.reset();await loadReviews();alert('نظر شما ثبت شد.')}catch(err){alert(err.message)}}</script></body></html>
