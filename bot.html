<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><link rel="icon" type="image/svg+xml" href="images/firan-logo.svg"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="فیران کالا؛ فروشگاه آنلاین محصولات دیجیتال، لوازم جانبی و لوازم خانگی."><meta name="theme-color" content="#10201b"><title>دستیار فیران | فیران کالا</title><link rel="stylesheet" href="style.css"></head><body><header class="header"><div class="container nav"><a class="brand" href="index.html"><img src="images/firan-logo.svg" alt="فیران کالا"></a><nav><a href="index.html">خانه</a><a href="products.html">محصولات</a><a class="active" href="bot.html">دستیار فیران</a><a href="about.html">درباره ما</a></nav><a class="cart-top" href="cart.html"><span class="cart-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 4h2l2.2 10.2a2 2 0 0 0 2 1.6h7.9a2 2 0 0 0 1.9-1.4L21 7H7"/><circle cx="10" cy="19" r="1.5"/><circle cx="18" cy="19" r="1.5"/></svg></span><b data-cart-count class="cart-count" hidden></b><span>سبد خرید</span></a></div></header><main><section class="page-title"><div class="container"><span class="eyebrow">دستیار فیران</span><h1>راهنمای خرید هوشمند</h1><p>درباره محصولات، قیمت، دسته‌بندی و مقایسه کالاها سؤال کنید.</p></div></section><section class="bot-section"><div class="container bot-box"><div class="chat"><div id="chatMessages"><div class="msg bot">سلام! من دستیار فیران کالا هستم. چه محصولی می‌خواهید؟</div></div><div class="chat-row"><input id="botInput" placeholder="مثلاً ارزان‌ترین لپ‌تاپ چیست؟"><button id="botSend">ارسال</button></div></div></div></section></main><footer><div class="container"><span>© ۱۴۰۵ فیران کالا</span></div></footer><script src="products.js"></script><script src="script.js"></script><script>function sendBot(){const input=document.getElementById('botInput'),msg=input.value.trim();if(!msg)return;const box=document.getElementById('chatMessages');box.innerHTML+=`<div class="msg user">${msg.replace(/[<>]/g,'')}</div>`;input.value='';fetch('/api/bot/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:msg})}).then(r=>r.json()).then(d=>{box.innerHTML+=`<div class="msg bot">${String(d.reply||'پاسخی دریافت نشد.').replace(/</g,'&lt;')}</div>`}).catch(()=>box.innerHTML+='<div class="msg bot">سرور فیران در دسترس نیست.</div>').finally(()=>box.scrollTop=box.scrollHeight)}document.getElementById('botSend').addEventListener('click',sendBot);document.getElementById('botInput').addEventListener('keydown',e=>{if(e.key==='Enter')sendBot()});</script></body></html>
